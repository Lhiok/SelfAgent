# 复制为 config.yaml 后按需修改
# 各模块配置写在对应节下，便于维护；系统/用户环境变量仍可作为缺省回退

log:
  # 默认最低输出等级：verbose | debug | notice | warning | critical
  level: notice
  # 启用的输出模式：console | file | server
  modes:
    - console
    - file
  file:
    path: logs/app.log
    encoding: utf-8
  server:
    url: ""
    timeout: 5.0
  # 调试通道（对齐 Claude Code：会话文件 + 分类过滤）
  # 也可用环境变量：SELFAGENT_DEBUG=1、SELFAGENT_DEBUG_FILTER=api,skills、SELFAGENT_DEBUG_LOG_LEVEL=verbose
  debug:
    enabled: false
    # filter: "react,skills,!feishu"
    # dir: logs/debug
    # session_id: ""

ai:
  default_provider: deepseek
  deepseek:
    api_key: ""
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    # 读超时（秒）；也可写映射：{connect: 10, read: 180}
    timeout: 180.0
    # 超时/网络错误时额外重试次数
    retries: 1
    # 是否优先 SSE 流式（失败自动降级为非流式）
    stream: true

feishu:
  webhook_url: ""

react:
  # 默认模式：agent（直接执行）| plan（先规划）
  mode: agent
  max_steps: 12
  # 本轮步数硬上限（用户加步也不能超过）
  max_steps_hard_cap: 96
  # 步数用尽时询问用户可增加的步数选项
  step_extend_options: [6, 12, 24]
  # 可选：Agent 工作目录（local_file / search_code / shell_run / git_ops 的 root）
  # workdir: "."
  # 过程细节：off（仅最终答案）| summary（工具步骤摘要）| full（含 Input/Observation）
  detail: off
  # detail != off 时是否在每轮执行中实时打印
  stream_detail: true
  # 单段细节最大字符数（防刷屏）
  detail_max_chars: 2000
  conversation:
    # 连续对话保留的最大消息条数（不含 system）
    max_history_messages: 40
    # compact_use_ai：是否用 AI 做摘要压缩
    compact_use_ai: false
    # 是否在后续轮次注入“连续对话”提示
    inject_hint: true
    # 会话持久化目录；空则默认 logs/sessions（支持 --resume / /load）
    persist_dir: ""
  # 工具空转防护：重复同一 Action 或连续失败时干预/停止
  doom_loop:
    window: 6
    repeat_limit: 3
    fail_limit: 3
    warn_once: true
  plan:
    # Plan Mode 下是否允许只读工具探测
    allow_readonly_tools: true
    readonly_actions:
      local_file: [list, read]
      search_code: [search]
      git_ops: [status, diff, log, branch, show]
      web_fetch: [fetch]
      diff_review: [review]
      todo_tracker: [list, start]
      screenshot: [read]
      nodejs: [version]
      python: [version, compile]
      csharp: [version]
    # Plan Mode 下额外允许的交互 / 通知 Skill
    allow_skills:
      - ask_user
      - feishu_notify
      - request_capability
      - web_fetch
      - diff_review
      - todo_tracker
  # 同一步内可并行的只读工具上限
  max_tool_concurrency: 4
  system_prompt: |
    你是可调用工具的助手。请通过 function/tool 调用完成任务。
    任务完成时必须调用 finish，参数 {"answer":"最终答复"}。
    可在一轮中发起多个互不依赖的工具调用。
    ask_user 可连续调用暂存问题；finish / submit_plan / 其它工具前会一并询问用户。
    Plan Mode 下调研后调用 submit_plan 提交步骤。

skills:
  # 工具 Observation 进入模型前的统一截断（0 或不写 max_bytes 表示不按字节截断）
  output_max_chars: 20000
  # output_max_bytes: 65536
  local_file:
    # 允许读写的根目录，默认当前工作目录
    root: "."
    allow_write: true
  ask_user:
    # 向用户提问选型（Plan Mode 落地前确认）
    enabled: true
  request_capability:
    # 现有 Skill 不足时提交能力需求（落盘 + 飞书，不阻塞当前任务）
    enabled: true
    # 需求文档目录（相对 cwd 或绝对路径）
    output_dir: requirements
    notify_feishu: true
  search_code:
    enabled: true
    # root 默认沿用 local_file.root
  shell_run:
    # 受控命令执行；未写 allow_commands 时使用代码内默认白名单
    enabled: true
    timeout: 60
  feishu_notify:
    enabled: true
  git_ops:
    enabled: true
    # false=仅只读；true 允许 add/commit
    allow_write: false
    timeout: 60
  dotnet_build:
    enabled: true
    timeout: 180
  nodejs:
    enabled: true
    # npm | pnpm | yarn
    package_manager: npm
    timeout: 180
  python:
    enabled: true
    # 空则使用当前进程解释器（venv 友好）
    # python_bin: python
    timeout: 180
  csharp:
    enabled: true
    timeout: 180
  web_fetch:
    enabled: true
    # true 时允许访问内网（有 SSRF 风险，默认关闭）
    allow_private: false
    timeout: 20
    max_chars: 12000
  http_request:
    enabled: true
    allow_private: false
    timeout: 30
    max_chars: 20000
  diff_review:
    enabled: true
  todo_tracker:
    enabled: true
  screenshot:
    enabled: true
    output_dir: logs/screenshots
  browser:
    # 需 pip install playwright && playwright install chromium
    enabled: true
    allow_private: false
    output_dir: logs/browser

permission:
  # 是否启用权限控制
  enabled: true
  # 模式：default | accept_edits | plan | bypass | dont_ask
  mode: default
  # 未命中规则时的默认策略：deny | allow
  default_effect: deny
  # 规则语法：Skill / Skill(action) / Skill(prefix:*) / Skill(*)
  # 判定顺序：deny → ask → plan/mode → allow/session → default_effect
  rules:
    allow:
      - "local_file(list)"
      - "local_file(read)"
      - "local_file(write)"
      - "local_file(patch)"
      - "local_file(move)"
      - "search_code(search)"
      - "git_ops(status)"
      - "git_ops(diff)"
      - "git_ops(log)"
      - "git_ops(branch)"
      - "git_ops(show)"
      - "git_ops(add)"
      - "git_ops(commit)"
      - "ask_user"
      - "request_capability"
      - "shell_run(run)"
      - "feishu_notify(text)"
      - "feishu_notify(markdown)"
      - "dotnet_build(build)"
      - "dotnet_build(test)"
      - "dotnet_build(restore)"
      - "nodejs(install)"
      - "nodejs(test)"
      - "nodejs(build)"
      - "nodejs(script)"
      - "nodejs(run)"
      - "nodejs(version)"
      - "python(run)"
      - "python(test)"
      - "python(install)"
      - "python(module)"
      - "python(compile)"
      - "python(version)"
      - "csharp(restore)"
      - "csharp(build)"
      - "csharp(test)"
      - "csharp(run)"
      - "csharp(format)"
      - "csharp(version)"
      - "web_fetch(fetch)"
      - "http_request(request)"
      - "http_request(get)"
      - "http_request(post)"
      - "http_request(put)"
      - "http_request(patch)"
      - "http_request(delete)"
      - "diff_review(review)"
      - "todo_tracker(list)"
      - "todo_tracker(add)"
      - "todo_tracker(start)"
      - "todo_tracker(complete)"
      - "todo_tracker(remove)"
      - "todo_tracker(clear)"
      - "todo_tracker(update)"
      - "memory_ops(list)"
      - "memory_ops(read)"
      - "memory_ops(save)"
      - "memory_ops(search)"
      - "screenshot(capture)"
      - "screenshot(read)"
      - "browser(goto)"
      - "browser(content)"
      - "browser(screenshot)"
      - "browser(click)"
      - "browser(fill)"
      - "browser(evaluate)"
      - "run_subagent"
      - "mcp__*"
    deny: []
    ask: []

memory:
  # 文件型持久记忆（MEMORY.md + topic）；与会话 transcript 分离
  enabled: true
  dir: .selfagent/memory
  extract_enabled: true
  extract_min_user_chars: 20
  max_index_lines: 200
  max_index_bytes: 25600
  prefetch_top_k: 5
  session_notes_enabled: true
  compact_after_messages: 32
  compact_keep_recent: 12

plan:
  # Plan Mode 生命周期（enter → submit_plan → confirm/reject）
  enabled: true
  plans_dir: .selfagent/plans
  clear_context_on_confirm: false
  auto_restore_mode: true
  # 只读表仍见 react.plan.readonly_actions / allow_skills

workflow:
  # 编排层（队列 / YAML / Plan 落盘 / 任务 DAG）；推理仍在 agent/
  enabled: true
  max_workers: 2
  workflows_dir: .selfagent/workflows
  plans_dir: .selfagent/plans
  tasks_dir: .selfagent/tasks
  # 默认可关，避免意外定时触发
  cron_enabled: false
  queue_drain_per_turn: 4

mcp:
  # 外部 MCP 工具池（stdio）；工具名形如 mcp__{server}__{tool}
  servers: {}
  # 示例：
  # servers:
  #   echo:
  #     transport: stdio
  #     command: python
  #     args: ["-m", "tests.fixtures.mcp_echo_server"]
  #     enabled: true

hooks:
  # 完整事件见 hooks.HookEvent；command exit 2 = block
  # 也可写 .selfagent/hooks.yaml
  # PreToolUse:
  #   - matcher: local_file
  #     runner: command
  #     command: 'python -c "import sys; sys.exit(2)"'
  # Stop:
  #   - runner: command
  #     command: 'echo stopped'

regression:
  # 是否默认跑需要真实密钥的在线用例（DeepSeek / 飞书）
  include_live: false
  # 为空或省略表示全部模块；也可限定：env, log, skills, react, ai, feishu, permission
  modules: []
