[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfagent"
version = "0.1.0"
description = "SelfAgent CLI????????????????"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
skills = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
]
all = [
    "selfagent[dev,skills]",
]

[project.scripts]
selfagent-regression = "regression.__main__:main"
selfagent-cli = "cli.__main__:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
