[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfagent"
version = "0.1.0"
description = "SelfAgent Windows ????????????"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
skills = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
]
app = [
    "PySide6>=6.6.0",
]
all = [
    "selfagent[dev,skills,app]",
]

[project.scripts]
selfagent-regression = "regression.__main__:main"
selfagent-app = "app.__main__:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
