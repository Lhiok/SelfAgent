[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfagent"
version = "0.1.0"
description = "SelfAgent 通用智能体基础框架：环境、日志、飞书、AI、ReAct、Skill、权限、回归"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
skills = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
]
all = [
    "selfagent[dev,ui,skills]",
]

[project.scripts]
selfagent-regression = "regression.__main__:main"
selfagent-ui = "web.__main__:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
